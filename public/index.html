<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firepick Source Monitor</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("firepick-monitor-theme") || "auto";
    } catch {}
  </script>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      --bg: #111216;
      --text: #eee;
      --muted: #989baa;
      --panel: #1a1c23;
      --table: #17191f;
      --border: #2b2e39;
      --accent: #ff8a00;
      --good: #73d18b;
      --bad: #ff7373;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f7f9;
      --text: #17191f;
      --muted: #666b78;
      --panel: #fff;
      --table: #fff;
      --border: #dfe2e8;
      --accent: #e67800;
      --good: #197a36;
      --bad: #bc3030;
    }
    @media (prefers-color-scheme: light) {
      :root[data-theme="auto"] {
        color-scheme: light;
        --bg: #f6f7f9;
        --text: #17191f;
        --muted: #666b78;
        --panel: #fff;
        --table: #fff;
        --border: #dfe2e8;
        --accent: #e67800;
        --good: #197a36;
        --bad: #bc3030;
      }
    }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { width: min(1120px, calc(100% - 32px)); margin: 40px auto; }
    h1 { margin-bottom: 6px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .theme-button { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
    .muted { color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 24px 0; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .stat strong { display: block; font-size: 28px; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; background: var(--table); border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    td:first-child { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
  </style>
</head>
<body>
<main>
  <div class="header">
    <h1>Firepick Source Monitor</h1>
    <button id="theme" class="theme-button" type="button">主题：跟随系统</button>
  </div>
  <div id="generated" class="muted">Loading latest data…</div>
  <section id="stats" class="stats"></section>
  <table>
    <thead><tr><th>站点</th><th>状态</th><th>列表</th><th>搜索</th><th>清晰度</th><th>评分</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script src="./data/latest.js"></script>
<script>
  const text = (value) => document.createTextNode(value == null ? "" : String(value));
  const themeButton = document.getElementById("theme");
  const themes = ["auto", "light", "dark"];
  const themeLabels = { auto: "跟随系统", light: "浅色", dark: "深色" };
  let currentTheme = document.documentElement.dataset.theme || "auto";
  function applyTheme(theme) {
    currentTheme = theme;
    document.documentElement.dataset.theme = theme;
    themeButton.textContent = `主题：${themeLabels[theme]}`;
    try { localStorage.setItem("firepick-monitor-theme", theme); } catch {}
  }
  themeButton.addEventListener("click", () => {
    const next = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
    applyTheme(next);
  });
  applyTheme(currentTheme);

  function render(data) {
      document.getElementById("generated").textContent =
        `Updated ${data.generatedAt} · ${data.onlineCount}/${data.total} online`;
      const stats = document.getElementById("stats");
      const values = [
        ["Total", data.total],
        ["Online", data.onlineCount],
        ["Offline", data.total - data.onlineCount],
        ["With quality", data.results.filter((item) => item.quality?.height).length]
      ];
      for (const [label, value] of values) {
        const card = document.createElement("div");
        card.className = "stat";
        const strong = document.createElement("strong");
        strong.append(text(value));
        card.append(strong, text(label));
        stats.append(card);
      }
      const rows = document.getElementById("rows");
      for (const item of data.results.sort((a, b) => b.score - a.score)) {
        const row = document.createElement("tr");
        const fields = [
          item.name,
          item.online ? "在线" : "失败",
          `${item.listMs}ms`,
          String(item.searchHits),
          item.quality ? `${item.quality.width}×${item.quality.height}` : "未知",
          String(item.score)
        ];
        fields.forEach((value, index) => {
          const cell = document.createElement("td");
          cell.append(text(value));
          if (index === 1) cell.className = item.online ? "good" : "bad";
          row.append(cell);
        });
        rows.append(row);
      }
  }
  if (window.__FIREPICK_LATEST__) {
    render(window.__FIREPICK_LATEST__);
  } else {
    fetch("./data/latest.json", { cache: "no-store" })
      .then((response) => response.json())
      .then(render)
      .catch((error) => {
        document.getElementById("generated").textContent = `Load failed: ${error}`;
      });
  }
</script>
</body>
</html>

name = "firepick-source-api"
main = "worker/index.mjs"
compatibility_date = "2025-04-01"

routes = [
  { pattern = "sources.yychuiyan.com/api/v1/*", zone_name = "yychuiyan.com" }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/v1/*"]

name: deploy-worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker
        run: |
          npm run check
          npm test
      - name: Check deployment secrets
        id: config
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] \
            && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] \
            && [ -n "$GITHUB_DISPATCH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Worker deployment skipped: configure all three repository secrets first."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Worker secret
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_DISPATCH_TOKEN" |
            npx --yes wrangler@4.162.0 secret put GITHUB_DISPATCH_TOKEN
      - name: Deploy Worker and cron trigger
        if: steps.config.outputs.configured == 'true'
        run: npx --yes wrangler@4.162.0 deploy

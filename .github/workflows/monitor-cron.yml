name: monitor-cron

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: firepick-source-monitor-cron
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow monitor.yml \
            --limit 10 \
            --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "A source monitor run is already queued or running."
            exit 0
          fi
          gh workflow run monitor.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main

name: monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: firepick-source-monitor
  cancel-in-progress: true

jobs:
  probe-and-publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET: ${{ secrets.COS_BUCKET }}
      COS_REGION: ${{ secrets.COS_REGION }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe CMS sources
        run: npm run probe
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deploy Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=firepick-source-monitor --branch=main
      - name: Install coscli
        if: ${{ env.COS_SECRET_ID != '' && env.COS_SECRET_KEY != '' && env.COS_BUCKET != '' && env.COS_REGION != '' }}
        run: |
          curl -fsSL \
            -o "$RUNNER_TEMP/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          chmod +x "$RUNNER_TEMP/coscli"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Configure coscli
        if: ${{ env.COS_SECRET_ID != '' && env.COS_SECRET_KEY != '' && env.COS_BUCKET != '' && env.COS_REGION != '' }}
        run: |
          printf '%s\n' \
            "$HOME/.cos.yaml" \
            "" \
            "$COS_SECRET_ID" \
            "$COS_SECRET_KEY" \
            "" \
            "true" \
            "true" \
            "true" \
            "" \
            "$COS_BUCKET" \
            "cos.${COS_REGION}.myqcloud.com" \
            "" \
            "false" \
            | coscli config init
      - name: Sync JSON to COS
        if: ${{ env.COS_SECRET_ID != '' && env.COS_SECRET_KEY != '' && env.COS_BUCKET != '' && env.COS_REGION != '' }}
        run: |
          for file in public/data/*.json; do
            name="$(basename "$file")"
            coscli cp "$file" \
              "cos://${COS_BUCKET}/firepick-monitor/data/${name}" \
              --acl public-read \
              --process-log false \
              --meta 'Content-Type:application/json;charset=utf-8#Cache-Control:no-cache, max-age=0'
          done

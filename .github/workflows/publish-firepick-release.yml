name: publish-firepick-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Firepick release version without the v prefix
        required: true
        default: 0.1.32

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET: ${{ secrets.COS_BUCKET }}
      COS_REGION: ${{ secrets.COS_REGION }}
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Firepick release assets
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "v${VERSION}" \
            --repo yychuiyan/firepick \
            --dir release \
            --pattern "Firepick-${VERSION}.ipa" \
            --pattern "AppIcon-${VERSION}.png" \
            --pattern "firepick.json"
      - name: Install coscli
        run: |
          curl -fsSL \
            -o "$RUNNER_TEMP/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          chmod +x "$RUNNER_TEMP/coscli"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Configure coscli
        run: |
          set -euo pipefail
          umask 077
          COS_CONFIG="$RUNNER_TEMP/coscli.yaml"
          cat > "$COS_CONFIG" <<EOF
          cos:
            base:
              secretid: "${COS_SECRET_ID}"
              secretkey: "${COS_SECRET_KEY}"
              sessiontoken: ""
              protocol: https
              servicedomain: ""
              mode: ""
              cvmrolename: ""
              closeautoswitchhost: "true"
              disableencryption: "true"
              disableautofetchbuckettype: "true"
              proxy: ""
            buckets:
            - name: "${COS_BUCKET}"
              alias: "${COS_BUCKET}"
              region: ""
              endpoint: cos.${COS_REGION}.myqcloud.com
              ofs: false
              customized: false
          EOF
          echo "COSCLI_CONFIG=$COS_CONFIG" >> "$GITHUB_ENV"
      - name: Upload Firepick release
        run: |
          set -euo pipefail
          coscli -c "$COSCLI_CONFIG" cp \
            "release/Firepick-${VERSION}.ipa" \
            "cos://${COS_BUCKET}/firepick/Firepick-${VERSION}.ipa" \
            --acl public-read \
            --process-log=false \
            --part-size 5 \
            --thread-num 32 \
            --max-thread-num 32 \
            --meta 'Content-Type:application/octet-stream#Cache-Control:public, max-age=31536000, immutable'
          coscli -c "$COSCLI_CONFIG" cp \
            "release/AppIcon-${VERSION}.png" \
            "cos://${COS_BUCKET}/firepick/AppIcon-${VERSION}.png" \
            --acl public-read \
            --process-log=false \
            --meta 'Content-Type:image/png#Cache-Control:public, max-age=31536000, immutable'
          coscli -c "$COSCLI_CONFIG" cp \
            "release/firepick.json" \
            "cos://${COS_BUCKET}/firepick/firepick.json" \
            --acl public-read \
            --process-log=false \
            --meta 'Content-Type:application/json;charset=utf-8#Cache-Control:no-cache, max-age=0'
      - name: Verify public release
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/firepick/firepick.json?ts=$(date +%s)" \
            | jq -e --arg version "$VERSION" \
                --arg url "https://dl.yychuiyan.com/firepick/Firepick-${VERSION}.ipa" \
                '.apps[0].version == $version and .apps[0].downloadURL == $url'
          curl -fsSL --range 0-1023 --output /dev/null \
            "https://dl.yychuiyan.com/firepick/Firepick-${VERSION}.ipa"
          curl -fsSL --output /dev/null \
            "https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/firepick/AppIcon-${VERSION}.png?ts=$(date +%s)"
